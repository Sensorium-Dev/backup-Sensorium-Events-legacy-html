# SENSORIUM — Netlify Configuration
# FILE LOCATION IN YOUR REPO: netlify.toml (root level, same folder as index.html)

[build]
  publish = "."
  command = ""

# ── EDGE FUNCTIONS ──────────────────────────────────────────────────────
[[edge_functions]]
  function = "ai-assistant"
  path = "/api/ai-assistant"

# ── ENVIRONMENT ──────────────────────────────────────────────────────────
# Tells Netlify which env vars to expose to Edge Functions
[build.environment]
  NODE_VERSION = "18"

# ── REDIRECTS ────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── SECURITY HEADERS ─────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── CACHING ──────────────────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
