# SENSORIUM — Netlify Configuration
# FILE LOCATION IN YOUR REPO: netlify.toml (root level, same folder as index.html)

[build]
  publish = "."
  command = ""

# ── EDGE FUNCTIONS ──────────────────────────────────────────────────────
[[edge_functions]]
  function = "ai-assistant"
  path = "/api/ai-assistant"

# ── ENVIRONMENT ──────────────────────────────────────────────────────────
[build.environment]
  NODE_VERSION = "18"

# ── REDIRECTS ────────────────────────────────────────────────────────────
[[redirects]]
  from = "/vendor"
  to = "/vendor.html"
  status = 200

[[redirects]]
  from = "/practitioner"
  to = "/practitioner.html"
  status = 200

# ── SECURITY HEADERS ─────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ── CACHING ──────────────────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── PLUGINS ──────────────────────────────────────────────────────────────
# Ignore Google Fonts URLs so link checker doesn't fail on external font timeouts
[[plugins]]
  package = "netlify-plugin-checklinks"
  [plugins.inputs]
    skipPatterns = [
      "fonts.googleapis.com",
      "fonts.gstatic.com"
    ]
